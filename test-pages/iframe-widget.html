<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Embedded ATS Widget</title>
<style>
  body { font-family: sans-serif; margin: 20px; background: #f8fafc; }
  label { display: block; margin-top: 10px; font-size: 12px; }
  input, select { width: 100%; padding: 5px; margin-top: 3px; box-sizing: border-box; }
</style>
</head>
<body>
  <h3>Application Form (embedded)</h3>
  <form>
    <label>First Name <input name="firstName" /></label>
    <label>Last Name <input name="lastName" /></label>
    <label>Email <input name="email" type="email" /></label>
    <label>LinkedIn <input name="linkedin" /></label>
    <label>Current Company <input name="currentCompany" /></label>
  </form>
</body>
</html>
