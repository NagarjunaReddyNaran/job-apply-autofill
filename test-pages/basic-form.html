<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Basic Job Application (Test Page)</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  label { display: block; margin-top: 12px; font-size: 13px; color: #333; }
  input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
  .radio-row label { display: inline-block; margin-right: 16px; font-weight: normal; }
</style>
</head>
<body>
  <h1>Apply to Acme Corp — Software Engineer</h1>
  <form>
    <label for="first_name">First Name
      <input id="first_name" name="first_name" type="text" />
    </label>
    <label for="last_name">Last Name
      <input id="last_name" name="last_name" type="text" />
    </label>
    <label for="email_addr">Email Address
      <input id="email_addr" name="email_addr" type="email" />
    </label>
    <label for="phone_num">Phone Number
      <input id="phone_num" name="phone_num" type="tel" />
    </label>
    <label for="city">City
      <input id="city" name="city" type="text" />
    </label>
    <label for="li">LinkedIn Profile URL
      <input id="li" name="li" type="text" />
    </label>

    <label>Are you legally authorized to work in this country?
      <div class="radio-row">
        <label><input type="radio" name="work_auth" value="yes" /> Yes</label>
        <label><input type="radio" name="work_auth" value="no" /> No</label>
      </div>
    </label>

    <label>Will you now or in the future require visa sponsorship?
      <div class="radio-row">
        <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
        <label><input type="radio" name="sponsorship" value="no" /> No</label>
      </div>
    </label>

    <label for="years_exp">Years of Experience
      <select id="years_exp" name="years_exp">
        <option value="">Select…</option>
        <option value="0-1">0-1</option>
        <option value="2-4">2-4</option>
        <option value="5-9">5-9</option>
        <option value="10+">10+</option>
      </select>
    </label>

    <label for="resume">Resume
      <input id="resume" name="resume" type="file" />
    </label>

    <label>A question the extension shouldn't guess:
      <input type="text" name="favorite_animal" placeholder="Favorite animal?" />
    </label>

    <p><button type="button" onclick="alert('This test page never actually submits.')">Submit Application</button></p>
  </form>
</body>
</html>
